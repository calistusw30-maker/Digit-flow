<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digit-flow Live</title>

  <style>
    body{
      background:#020827;
      color:white;
      font-family:Arial,sans-serif;
      text-align:center;
      margin:0;
      padding:20px;
    }

    h1{
      color:#00d9ff;
      font-size:42px;
      margin-top:20px;
    }

    #price{
      font-size:54px;
      color:#00ff99;
      margin:20px 0;
      font-weight:bold;
      min-height:64px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:14px;
      max-width:650px;
      margin:20px auto;
    }

    .box{
      background:#16214a;
      border-radius:18px;
      padding:20px 10px;
      box-shadow:0 4px 12px rgba(0,0,0,.35);
    }

    .box b{
      display:block;
      font-size:32px;
      color:#00d9ff;
      margin-top:8px;
    }

    #history{
      margin-top:26px;
      max-width:800px;
      margin-left:auto;
      margin-right:auto;
      word-break:break-word;
      font-size:18px;
      line-height:1.6;
    }

    #status{
      margin-top:12px;
      color:#9fb3ff;
      font-size:16px;
    }

    .signal{
      margin:24px auto 0;
      max-width:420px;
      background:#10193d;
      border-radius:18px;
      padding:18px;
      border:1px solid #24336e;
    }

    .signal h3{
      margin:0 0 10px 0;
      color:#ffffff;
    }

    .buy{ color:#00ff99; font-weight:bold; }
    .sell{ color:#ff6b6b; font-weight:bold; }
  </style>
</head>
<body>

  <h1>Digit-flow Live</h1>

  <div id="price">Connecting...</div>
  <div id="status">Opening Deriv live stream...</div>

  <div class="grid" id="digits"></div>

  <div id="history"><b>Last digits:</b> Waiting for ticks...</div>

  <div class="signal">
    <h3>Live Signal</h3>
    <div id="signalText">Waiting for data...</div>
  </div>


<script>
let historyDigits = [];
let counts = Array(10).fill(0);

function drawDigits() {
  const wrap = document.getElementById('digits');
  wrap.innerHTML = '';

  counts.forEach((count, digit) => {
    wrap.innerHTML += `
      <div class="box">
        Digit ${digit}
        <b>${count}</b>
      </div>`;
  });
}

// Connect directly to Deriv live stream
const ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');

ws.onopen = () => {
  document.getElementById('price').innerText = 'Connected';
  document.getElementById('status').innerText = 'Streaming live ticks from Deriv';

  // Subscribe to live Volatility 10 Index ticks
  ws.send(JSON.stringify({
    ticks: 'R_10',
    subscribe: 1
  }));
};

ws.onmessage = (event) => {
  const data = JSON.parse(event.data);

  // Live tick received from Deriv
  if (data.tick) {

    const quote = data.tick.quote.toString();

    // Show live price
    document.getElementById('price').innerText = quote;

    // Extract last digit
    const digit = parseInt(quote.slice(-1));

    // Save last 50 digits
    historyDigits.unshift(digit);
    if (historyDigits.length > 50) historyDigits.pop();

    // Count digits
    counts = Array(10).fill(0);
    historyDigits.forEach(d => counts[d]++);

    drawDigits();

    // Show digit history
    document.getElementById('history').innerHTML =
      '<b>Last digits:</b> ' + historyDigits.join(' , ');
  }
};

ws.onerror = () => {
  document.getElementById('status').innerText = 'Connection error';
};

ws.onclose = () => {
  document.getElementById('status').innerText = 'Disconnected from Deriv';
};

drawDigits();
</script>
</body>
</html>
